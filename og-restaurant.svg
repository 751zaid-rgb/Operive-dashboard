<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Operive Restaurant Open Graph Card</title>
  <desc id="desc">Operive restaurant social card with booking-focused headline, WhatsApp and Telegram subline, and subtle restaurant visual.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111b36"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#335cff"/>
      <stop offset="100%" stop-color="#6b8fff"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 152) rotate(40) scale(340 340)">
      <stop offset="0%" stop-color="#6b8fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6b8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 306) rotate(180) scale(320 320)">
      <stop offset="0%" stop-color="#335cff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#335cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-left)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-right)"/>
  <rect x="100" y="100" width="1000" height="430" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" fill="#ffffff">
    <text x="120" y="150" font-size="38" font-weight="800" letter-spacing="-0.03em">Operive</text>
    <text x="120" y="214" font-size="22" font-weight="700" letter-spacing="0.2em" fill="#a0aec0">FOR RESTAURANTS</text>
    <text x="120" y="308" font-size="78" font-weight="800" letter-spacing="-0.05em">Never Miss a</text>
    <text x="120" y="392" font-size="78" font-weight="800" letter-spacing="-0.05em">Booking Again.</text>
    <text x="120" y="458" font-size="31" font-weight="500" fill="#a0aec0">AI front desk for WhatsApp &amp; Telegram</text>
  </g>

  <g transform="translate(830 152)" opacity="0.95">
    <circle cx="135" cy="160" r="150" fill="url(#accent-gradient)" opacity="0.12" filter="url(#soft-glow)"/>
    <circle cx="135" cy="160" r="92" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="10"/>
    <circle cx="135" cy="160" r="64" fill="none" stroke="url(#accent-gradient)" stroke-width="4" opacity="0.9"/>
    <path d="M79 80v148" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round"/>
    <path d="M63 80v62M79 80v62M95 80v62" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round"/>
    <path d="M205 78c0 30-8 52-24 66v84" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M179 96c0 18 10 31 26 40" stroke="#6b8fff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M71 176c22 16 42 24 64 24 20 0 40-6 60-18" fill="none" stroke="#8da9ff" stroke-width="6" stroke-linecap="round" opacity="0.82"/>
  </g>

  <g transform="translate(947 496)">
    <rect x="0" y="0" width="133" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <text x="66.5" y="24" text-anchor="middle" font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Restaurant AI</text>
  </g>
</svg>
