<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Operive Homepage Open Graph Card</title>
  <desc id="desc">Operive homepage social card with AI front desk headline, WhatsApp and Telegram subline, and brand blue visual on the right.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111b36"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#335cff"/>
      <stop offset="100%" stop-color="#6b8fff"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 152) rotate(40) scale(340 340)">
      <stop offset="0%" stop-color="#6b8fff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6b8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(945 300) rotate(180) scale(320 320)">
      <stop offset="0%" stop-color="#335cff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#335cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-left)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-right)"/>

  <rect x="100" y="100" width="1000" height="430" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" fill="#ffffff">
    <text x="120" y="150" font-size="38" font-weight="800" letter-spacing="-0.03em">Operive</text>
    <text x="120" y="214" font-size="22" font-weight="700" letter-spacing="0.2em" fill="#a0aec0">AI FRONT DESK</text>
    <text x="120" y="308" font-size="78" font-weight="800" letter-spacing="-0.05em">Your Business Replies.</text>
    <text x="120" y="392" font-size="78" font-weight="800" letter-spacing="-0.05em">Even When You Don't.</text>
    <text x="120" y="458" font-size="31" font-weight="500" fill="#a0aec0">WhatsApp &amp; Telegram — powered by AI</text>
  </g>

  <g transform="translate(822 165)">
    <circle cx="138" cy="142" r="150" fill="url(#accent-gradient)" opacity="0.14" filter="url(#soft-glow)"/>
    <path d="M71 82c0-24.301 19.699-44 44-44h96c24.301 0 44 19.699 44 44v70c0 24.301-19.699 44-44 44h-56l-34 31c-5.575 5.086-14.575 1.13-14.575-6.417V196h-11.425c-24.301 0-44-19.699-44-44V82Z" fill="rgba(255,255,255,0.06)" stroke="url(#accent-gradient)" stroke-width="4"/>
    <path d="M100 99c18-22 39-32 62-32 21 0 39 8 55 24" fill="none" stroke="#6b8fff" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
    <path d="M100 129c19-17 39-25 62-25 22 0 42 8 61 24" fill="none" stroke="#8da9ff" stroke-width="10" stroke-linecap="round" opacity="0.92"/>
    <path d="M100 159c18-11 38-17 61-17 22 0 42 6 61 17" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <circle cx="119" cy="109" r="8" fill="#335cff"/>
    <circle cx="161" cy="144" r="8" fill="#6b8fff"/>
    <circle cx="205" cy="113" r="8" fill="#ffffff"/>
  </g>
</svg>
