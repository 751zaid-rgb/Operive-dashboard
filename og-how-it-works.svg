<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Operive How It Works Open Graph Card</title>
  <desc id="desc">Operive how-it-works social card with launch-speed headline, concise subline, and numbered workflow visual.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111b36"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#335cff"/>
      <stop offset="100%" stop-color="#6b8fff"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 152) rotate(40) scale(340 340)">
      <stop offset="0%" stop-color="#6b8fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6b8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 306) rotate(180) scale(320 320)">
      <stop offset="0%" stop-color="#335cff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#335cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-left)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-right)"/>
  <rect x="100" y="100" width="1000" height="430" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" fill="#ffffff">
    <text x="120" y="150" font-size="38" font-weight="800" letter-spacing="-0.03em">Operive</text>
    <text x="120" y="214" font-size="22" font-weight="700" letter-spacing="0.2em" fill="#a0aec0">HOW IT WORKS</text>
    <text x="120" y="308" font-size="78" font-weight="800" letter-spacing="-0.05em">Live in Days.</text>
    <text x="120" y="392" font-size="78" font-weight="800" letter-spacing="-0.05em">Not Months.</text>
    <text x="120" y="458" font-size="31" font-weight="500" fill="#a0aec0">From intake to live AI front desk — fast</text>
  </g>

  <g transform="translate(772 180)" opacity="0.97">
    <circle cx="194" cy="135" r="150" fill="url(#accent-gradient)" opacity="0.1" filter="url(#soft-glow)"/>
    <path d="M92 134H296" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="8" stroke-linecap="round"/>
    <path d="M116 134H272" fill="none" stroke="url(#accent-gradient)" stroke-width="8" stroke-linecap="round"/>
    <path d="M264 120l30 14-30 14" fill="none" stroke="#8da9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" font-weight="800" text-anchor="middle">
      <g transform="translate(110 134)">
        <circle r="30" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)"/>
        <text y="10" font-size="24" fill="#ffffff">1</text>
      </g>
      <g transform="translate(166 134)">
        <circle r="30" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.18)"/>
        <text y="10" font-size="24" fill="#ffffff">2</text>
      </g>
      <g transform="translate(222 134)">
        <circle r="30" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
        <text y="10" font-size="24" fill="#ffffff">3</text>
      </g>
      <g transform="translate(278 134)">
        <circle r="30" fill="url(#accent-gradient)"/>
        <text y="10" font-size="24" fill="#ffffff">4</text>
      </g>
    </g>
  </g>
</svg>
