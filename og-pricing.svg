<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Operive Pricing Open Graph Card</title>
  <desc id="desc">Operive pricing social card with simple pricing headline, concise subline, and abstract tiered block visual.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111b36"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#335cff"/>
      <stop offset="100%" stop-color="#6b8fff"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 152) rotate(40) scale(340 340)">
      <stop offset="0%" stop-color="#6b8fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6b8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 306) rotate(180) scale(320 320)">
      <stop offset="0%" stop-color="#335cff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#335cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-left)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-right)"/>
  <rect x="100" y="100" width="1000" height="430" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" fill="#ffffff">
    <text x="120" y="150" font-size="38" font-weight="800" letter-spacing="-0.03em">Operive</text>
    <text x="120" y="214" font-size="22" font-weight="700" letter-spacing="0.2em" fill="#a0aec0">SIMPLE PRICING</text>
    <text x="120" y="308" font-size="78" font-weight="800" letter-spacing="-0.05em">One Setup.</text>
    <text x="120" y="392" font-size="78" font-weight="800" letter-spacing="-0.05em">One Monthly Plan.</text>
    <text x="120" y="458" font-size="31" font-weight="500" fill="#a0aec0">No hidden fees. No vague consulting.</text>
  </g>

  <g transform="translate(824 154)" opacity="0.96">
    <circle cx="144" cy="158" r="150" fill="url(#accent-gradient)" opacity="0.12" filter="url(#soft-glow)"/>
    <rect x="44" y="158" width="196" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
    <rect x="68" y="116" width="172" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)"/>
    <rect x="92" y="74" width="148" height="34" rx="17" fill="url(#accent-gradient)" opacity="0.92"/>
    <path d="M96 249h148" stroke="rgba(255,255,255,0.14)" stroke-width="10" stroke-linecap="round"/>
    <path d="M118 249l18 18 38-42" fill="none" stroke="#8da9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M194 249l18 18 38-42" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
</svg>
