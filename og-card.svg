<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Operive Open Graph Card</title>
  <desc id="desc">Dark navy branded social card for Operive with glowing blue accent, logo mark, and headline text.</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#101a35"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#335cff"/>
      <stop offset="100%" stop-color="#6b8fff"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 168) rotate(52) scale(300 300)">
      <stop offset="0%" stop-color="#6b8fff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6b8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 520) rotate(180) scale(360 260)">
      <stop offset="0%" stop-color="#335cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#335cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-left)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow-right)"/>

  <g opacity="0.9">
    <path d="M0 510C208 430 384 412 584 446C814 486 980 430 1200 312V630H0Z" fill="#0f1730"/>
    <path d="M0 540C170 484 344 472 532 496C756 526 954 484 1200 386" fill="none" stroke="rgba(107,143,255,0.18)" stroke-width="2"/>
  </g>

  <rect x="100" y="100" width="1000" height="430" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>

  <g transform="translate(120 122)">
    <g filter="url(#soft-glow)">
      <rect x="0" y="0" width="76" height="76" rx="22" fill="url(#accent-gradient)"/>
    </g>
    <path d="M24 38c0-8.8 7.2-16 16-16h7v8h-6.8a8 8 0 0 0 0 16H47v8h-7c-8.8 0-16-7.2-16-16Z" fill="#ffffff"/>
    <circle cx="52" cy="31" r="5.5" fill="#ffffff"/>
    <path d="M50.8 35.2 35.2 50.8" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Sora, 'DM Sans', 'Space Grotesk', Arial, sans-serif" fill="#ffffff">
    <text x="214" y="171" font-size="38" font-weight="800" letter-spacing="-0.03em">Operive</text>
    <text x="120" y="278" font-size="76" font-weight="800" letter-spacing="-0.05em">AI front desk systems for</text>
    <text x="120" y="362" font-size="76" font-weight="800" letter-spacing="-0.05em">restaurants and home services</text>
    <text x="120" y="438" font-size="31" font-weight="500" fill="#a0aec0">Capture leads, answer common questions, and route sensitive cases with care.</text>
  </g>

  <g>
    <rect x="120" y="475" width="236" height="16" rx="8" fill="url(#accent-gradient)" opacity="0.95"/>
    <rect x="120" y="504" width="128" height="10" rx="5" fill="#ffffff" opacity="0.18"/>
    <rect x="262" y="504" width="188" height="10" rx="5" fill="#ffffff" opacity="0.1"/>
  </g>
</svg>
